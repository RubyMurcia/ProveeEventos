openapi: 3.1.0
info:
  title: ProveeEventos API
  version: 1.4.0
  description: |
    Contrato REST/JSON del MVP derivado de ProveeEventos SRS v1.3 y SAD v1.4.
    Prefijo /api/v1. Auth0 autentica; la API resuelve roles, membresías y tenant.
    UUID opacos, timestamps ISO 8601 UTC, montos string decimal y moneda COP.
    Los paths/DTO son propuestas contractuales donde SRS/SAD no fijan el detalle.
    Incorpora las decisiones aprobadas de Decisiones.md: cancelación por etapas (DEC-001), cierre y devengo de comisión (DEC-002),
    revisiones de oferta (DEC-005), capacidad por paquete (DEC-006), zona horaria IANA por evento (DEC-007),
    propiedad de empresa (DEC-008), niveles de verificación (DEC-009) y snapshots (DEC-018).
    v1.1.0 aplica las decisiones DEC-019..033 y TEC-006..011 (aprobadas el 23-11-2026): enums de negocio en
    español (DEC-022), estados de contratación y comisión (DEC-023), RFQ sin reapertura (DEC-026), comisión (DEC-027),
    contacto del proveedor (DEC-028), verificación y cuenta ortogonales (DEC-031), redondeo (DEC-032), organización activa
    por cabecera X-Organization-Id (TEC-006), registro autenticado (TEC-007), Magic Link sin token en la ruta (TEC-008),
    ConfirmBooking único con 409 CAPACITY_EXHAUSTED (TEC-009) y contrato de errores (TEC-011).
    Las operaciones sobre recursos de empresa aceptan X-Organization-Id (parámetro OrganizationId); si el usuario tiene
    varias membresías y no la envía, la API responde 400 ORGANIZATION_REQUIRED.

    v1.2.0 (Plan0003, Review V2) aplica TEC-011 ampliada y TEC-012 (aprobadas el 23-11-2026):
    paginación con un solo modelo por operación, If-Match en perfil y disponibilidad del proveedor, tabla de códigos de
    error, regla de exención de Idempotency-Key y convención de servidores. La ruta /rfq de v1.0 se renombró a
    /rfq-cycles en v1.1.0.

    v1.3.0 (Plan0004, Review V3): operación decideSuspensionReview y campos de revisión en Booking y Dispute (DEC-034);
    listProviderReviews pasa a paginación por cursor con limit máximo 50 (cambio incompatible con v1.2.0, sin clientes
    publicados); fecha límite y prórroga de solicitudes de titulares (DEC-037); Cache-Control no-store en
    todas las respuestas de Magic Link; metadatos de paginación obligatorios. Aplica DEC-035..037 (aprobadas con fecha
    23-11-2026); los plazos de DEC-037 requieren validación legal antes de operar con datos reales.

    v1.4.0 (Plan0002_UXUI) completa el contrato para la interfaz (propuesta, pendiente de aprobación — TEC-013): 28 operaciones
    de lectura y gestión que faltaban para requisitos ya definidos, campos de respuesta ausentes (contratación, solicitud e-RFQ,
    perfil propio, notificación, empresa) y correcciones de contrato frente al modelo de datos (TDD §4.6). Cambios incompatibles
    con v1.3.0, sin clientes publicados: taxTreatment y su validFrom obligatorios, Booking.packageId anulable,
    Booking.quotationItemId no anulable, Money limitado a 12 enteros, LegalHold.resourceType cerrado e inviteCoordinator sin PROPIETARIO.
    Corrige además la composición de esquemas: las respuestas ya no heredan additionalProperties false de los cuerpos de
    petición (ahora componen una base *Fields y los cuerpos se cierran con unevaluatedProperties false).

    Errores (TEC-011; SAD §10.6). Toda respuesta 4xx/5xx usa application/problem+json con el campo code
    del catálogo ErrorCode; el cliente decide por code, nunca por el texto. Correspondencia:
    400 VALIDATION_FAILED, ORGANIZATION_REQUIRED · 401 UNAUTHENTICATED · 403 FORBIDDEN ·
    404 NOT_FOUND (también para recursos de otro tenant), MAGIC_LINK_INVALID ·
    409 CAPACITY_EXHAUSTED, AWARD_ALREADY_EXISTS, OFFER_NOT_AWARDABLE, OFFER_EXPIRED, RFQ_NOT_OPEN, SLA_EXPIRED,
    INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED, PLAN_LIMIT_REACHED, ASSISTED_RESPONSE_MISMATCH ·
    412 PRECONDITION_FAILED · 429 RATE_LIMITED · 500 INTERNAL_ERROR · 503 DEPENDENCY_UNAVAILABLE.

    Idempotencia (TEC-003; exenciones según TEC-011). Toda creación con efecto no repetible exige
    Idempotency-Key. Quedan exentos, con su motivo: createMediaUploadSignature, buildWhatsappClickToChat,
    createAssistedResponsePrompt y validateAssistedResponse (cálculo sin efecto persistente); markNotificationRead
    (idempotente por naturaleza); receiveSendgridEvents (deduplicado por sg_event_id); getMagicLinkForm (lectura sin
    efecto de negocio; la respuesta por Magic Link sí exige la cabecera y además consume el token una sola vez).

    Paginación (TEC-012; SAD §10.7). Por página (page, pageSize ≤ 100, PageMeta) en las colecciones del
    tenant y de administración; por cursor (cursor, limit, CursorPageMeta) en searchProviders y listProviderReviews
    (limit ≤ 50), listNotifications y searchAuditLogs. Cada operación usa un solo modelo; mezclar parámetros responde 400.

    Los endpoints operativos GET /health/live y GET /health/ready quedan fuera de este contrato y del prefijo /api/v1
    (SAD §10.8).
servers:
  - url: https://api.proveeeventos.example.com/api/v1
    description: Producción (dominio ilustrativo por sustituir)
  - url: https://api.staging.proveeeventos.example.com/api/v1
    description: Staging (ilustrativo; mismo contrato, datos de prueba)
  - url: http://localhost:4000/api/v1
    description: Desarrollo local
tags:
  - {name: Identity}
  - {name: Organizations}
  - {name: Providers}
  - {name: Catalog}
  - {name: Events}
  - {name: Quotations}
  - {name: Bookings}
  - {name: RFQ}
  - {name: Magic Links}
  - {name: Assisted Responses}
  - {name: Reviews}
  - {name: Notifications}
  - {name: Admin}
security:
  - bearerAuth: []
paths:
  /me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      summary: Consultar perfil y membresías del usuario
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Perfil interno, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/preferences:
    patch:
      tags: [Identity]
      operationId: updateMyPreferences
      summary: Actualizar contacto y preferencias de notificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: {type: [string, 'null'], maxLength: 40}
                notificationPreferences: {$ref: '#/components/schemas/NotificationPreferences'}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/data-requests:
    get:
      tags: [Identity]
      operationId: listMyDataRequests
      summary: Listar mis solicitudes de titular de datos
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Solicitudes del titular, content: {application/json: {schema: {$ref: '#/components/schemas/DataSubjectRequestPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Identity]
      operationId: createDataSubjectRequest
      summary: Solicitar consulta, corrección o supresión de datos
      description: Registra la solicitud en estado RECIBIDA con responsable y fecha (SRS-NFR-PRIV-002) y calcula dueDate con los plazos provisionales de SRS-ADM-012 (DEC-037), sujetos a validación legal (Ley 1581 de 2012).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DataSubjectRequestInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Solicitud registrada, content: {application/json: {schema: {$ref: '#/components/schemas/DataSubjectRequest'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations:
    post:
      tags: [Organizations]
      operationId: registerOrganization
      summary: Registrar empresa organizadora
      description: Requiere token Auth0 de un usuario sin membresía (TEC-007). El email se toma del token; la cuenta queda pendiente hasta que el email esté verificado. Quien registra queda como PROPIETARIO.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationRegistration'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Empresa registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/current:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: getCurrentOrganization
      summary: Consultar empresa activa
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Empresa y plan asignado, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Organizations]
      operationId: updateCurrentOrganization
      summary: Actualizar datos de empresa
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationUpdate'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Empresa actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/coordinators:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: listCoordinators
      summary: Listar coordinadores
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Lista paginada, content: {application/json: {schema: {$ref: '#/components/schemas/CoordinatorPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Organizations]
      operationId: inviteCoordinator
      summary: Invitar coordinador con token de un solo uso
      description: |
        Solo PROPIETARIO o ADMIN_EMPRESA, dentro del límite del plan (SRS-AUTH-006, SRS-TEN-004). Crea la invitación y
        registra el envío del email en el outbox en la misma transacción; el despacho es asíncrono (SAD §7.4), por eso
        responde 202.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
                displayName: {type: [string, 'null'], maxLength: 160}
                role: {type: string, enum: [ADMIN_EMPRESA, COORDINADOR, COORDINADOR_RESTRINGIDO], description: PROPIETARIO no se asigna por invitación (DEC-008).}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '202': {description: Invitación aceptada para envío asíncrono, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/ownership-transfer:
    get:
      tags: [Organizations]
      operationId: getPendingOwnershipTransfer
      summary: Consultar la transferencia de propiedad pendiente
      description: |
        Solo el PROPIETARIO y el destinatario. Sin transferencia pendiente responde 404 (SRS-AUTH-009).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Transferencia pendiente, content: {application/json: {schema: {$ref: '#/components/schemas/OwnershipTransfer'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Organizations]
      operationId: transferOrganizationOwnership
      summary: Iniciar transferencia de propiedad de la empresa
      description: |
        Solo el PROPIETARIO actual. Exige confirmación del propietario actual y aceptación del nuevo propietario (DEC-008).
        El nuevo propietario debe ser un ADMIN_EMPRESA activo de la misma empresa; la operación queda auditada y requiere
        autenticación reciente (SRS-AUTH-012).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newOwnerMembershipId]
              properties:
                newOwnerMembershipId: {$ref: '#/components/schemas/UUID'}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '202': {description: Transferencia pendiente de aceptación, content: {application/json: {schema: {$ref: '#/components/schemas/OwnershipTransfer'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/ownership-transfer/{transferId}/accept:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: transferId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Organizations]
      operationId: acceptOwnershipTransfer
      summary: Aceptar transferencia de propiedad
      description: Solo el nuevo propietario designado, que debe ser ADMIN_EMPRESA activo de la empresa (SRS-AUTH-009, DEC-008). Requiere autenticación reciente (SRS-AUTH-012).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Transferencia aceptada, content: {application/json: {schema: {$ref: '#/components/schemas/OwnershipTransfer'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/ownership-transfer/{transferId}/reject:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: transferId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Organizations]
      operationId: rejectOwnershipTransfer
      summary: Rechazar transferencia de propiedad
      description: Solo el nuevo propietario designado (SRS-AUTH-009, DEC-008). La transferencia queda RECHAZADA y el propietario actual conserva el rol PROPIETARIO.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Transferencia rechazada, content: {application/json: {schema: {$ref: '#/components/schemas/OwnershipTransfer'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/coordinators/{coordinatorId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    patch:
      tags: [Organizations]
      operationId: updateCoordinator
      summary: Actualizar estado o rol de coordinador
      description: Solo PROPIETARIO o ADMIN_EMPRESA (SRS-AUTH-006, SRS-AUTH-009). El rol PROPIETARIO no se asigna por esta vía; la transferencia de propiedad usa ownership-transfer. Cambiar roles exige autenticación reciente (SRS-AUTH-012).
      parameters:
        - {name: coordinatorId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: {type: string, enum: [ACTIVO, SUSPENDIDO]}
                role:
                  type: string
                  enum: [ADMIN_EMPRESA, COORDINADOR, COORDINADOR_RESTRINGIDO]
                  description: Rol de membresía asignable; PROPIETARIO queda excluido (DEC-008, DEC-022).
              additionalProperties: false
      responses:
        '200': {description: Coordinador actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Coordinator'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/coordinators/{coordinatorId}/invitation/resend:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: coordinatorId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Organizations]
      operationId: resendInvitation
      summary: Reenviar invitación de coordinador
      description: Solo PROPIETARIO o ADMIN_EMPRESA (SRS-AUTH-006). Genera un nuevo token de un solo uso e invalida el anterior; el email se envía de forma asíncrona desde el outbox (SAD §7.4).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '202': {description: Invitación reenviada para envío asíncrono, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/invitations/{invitationId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: invitationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete:
      tags: [Organizations]
      operationId: revokeInvitation
      summary: Revocar invitación pendiente
      description: Solo PROPIETARIO o ADMIN_EMPRESA (SRS-AUTH-006). Invalida el token; una invitación ya ACEPTADA no puede revocarse.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Invitación revocada}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/usage:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: getPlanUsage
      summary: Consultar plan y consumo de límites
      description: Visible para PROPIETARIO y ADMIN_EMPRESA (SRS-TEN-004, SRS-ADM-009). Muestra límites configurados y consumo actual; si el plan no define cuota, el límite es null y no se inventa (SRS-TEN-003).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plan y consumo, content: {application/json: {schema: {$ref: '#/components/schemas/PlanUsage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/whatsapp-templates:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: listOrganizationWhatsappTemplates
      summary: Listar plantillas WhatsApp privadas de la empresa
      description: Lista las copias privadas de la empresa activa. No altera las plantillas globales (SRS-ADM-004, SRS-WA-001).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Copias privadas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/OrganizationWhatsappTemplate'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Organizations]
      operationId: createOrganizationWhatsappTemplate
      summary: Crear copia privada de plantilla WhatsApp
      description: Crea una personalización privada, opcionalmente a partir de una plantilla global (baseTemplateId). Renderizado determinista con variables permitidas (SRS-WA-002).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrganizationWhatsappTemplateCreate'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Copia creada, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationWhatsappTemplate'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /organizations/current/whatsapp-templates/{templateId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: templateId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Organizations]
      operationId: updateOrganizationWhatsappTemplate
      summary: Editar copia privada de plantilla WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WhatsappTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Copia actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationWhatsappTemplate'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /invitations/accept:
    post:
      tags: [Identity]
      operationId: acceptInvitation
      summary: Aceptar invitación de coordinador
      description: Requiere usuario autenticado (SRS-AUTH-006). El token es de un solo uso y expira; la membresía se crea con el rol de la invitación. No se envía X-Organization-Id porque el usuario puede no tener aún membresía.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 1, description: Token de un solo uso recibido por email}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Membresía creada, content: {application/json: {schema: {$ref: '#/components/schemas/Coordinator'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers:
    post:
      tags: [Providers]
      operationId: registerProvider
      summary: Registrar proveedor en estado PENDIENTE
      description: Requiere token Auth0 de un usuario sin perfil de proveedor (TEC-007); el email se toma del token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderRegistration'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Proveedor creado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers/me:
    get:
      tags: [Providers]
      operationId: getMyProvider
      summary: Consultar perfil propio
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Perfil proveedor, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderOwnProfile'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Providers]
      operationId: updateMyProvider
      summary: Actualizar perfil propio
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProviderUpdate'}
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '412': {description: La versión cambió (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '200': {description: Perfil actualizado, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderOwnProfile'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers/me/packages:
    get:
      tags: [Providers]
      operationId: listMyPackages
      summary: Listar paquetes propios
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Paquetes, content: {application/json: {schema: {$ref: '#/components/schemas/PackagePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Providers]
      operationId: createPackage
      summary: Crear paquete de servicio
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Paquete creado, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePackage'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers/me/packages/{packageId}:
    parameters:
      - {name: packageId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Providers]
      operationId: getMyPackage
      summary: Consultar paquete propio
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Paquete, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePackage'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Providers]
      operationId: updatePackage
      summary: Actualizar paquete
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PackageInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Paquete actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/ServicePackage'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {description: La versión cambió (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Providers]
      operationId: deactivatePackage
      summary: Desactivar paquete conservando historial
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Desactivado}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers/me/availability:
    get:
      tags: [Providers]
      operationId: getProviderAvailability
      summary: Consultar disponibilidad propia
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Fechas disponibles/ocupadas, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AvailabilityDay'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    put:
      tags: [Providers]
      operationId: setProviderAvailability
      summary: Marcar fechas como ocupadas o disponibles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: {type: array, items: {$ref: '#/components/schemas/AvailabilityInput'}}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IfMatch'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Disponibilidad actualizada, headers: {ETag: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '412': {description: La disponibilidad cambió desde la última lectura (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /providers/me/media/upload-signature:
    post:
      tags: [Providers]
      operationId: createMediaUploadSignature
      summary: Obtener firma de subida de portafolio
      description: Firma de alcance limitado para subir el archivo directamente a Cloudinary. Valida tipo MIME y tamaño contra los límites configurados (SRS-CAT-002). Expira en `expiresAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaType, mimeType, sizeBytes]
              properties:
                mediaType: {$ref: '#/components/schemas/MediaType'}
                mimeType: {type: string, minLength: 1, maxLength: 100}
                sizeBytes: {type: integer, minimum: 1}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Firma emitida, content: {application/json: {schema: {$ref: '#/components/schemas/MediaUploadSignature'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /providers/me/media:
    get:
      tags: [Providers]
      operationId: listMyMedia
      summary: Listar el portafolio propio
      description: |
        Medios propios en su orden (SRS-CAT-001, SRS-CAT-002).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Portafolio, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PortfolioMedia'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Providers]
      operationId: registerMedia
      summary: Registrar medio subido en el portafolio
      description: Confirma un archivo subido con la firma emitida. Respeta el máximo de 20 imágenes y 5 videos por proveedor (SRS-CAT-002).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [publicId, mediaType]
              properties:
                publicId: {type: string, minLength: 1, maxLength: 200}
                mediaType: {$ref: '#/components/schemas/MediaType'}
                description: {type: [string, 'null'], maxLength: 300}
                order: {type: integer, minimum: 1}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Medio registrado, content: {application/json: {schema: {$ref: '#/components/schemas/PortfolioMedia'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /providers/me/media/order:
    patch:
      tags: [Providers]
      operationId: reorderMedia
      summary: Reordenar portafolio propio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}, description: Orden completo de los medios propios; la posición define el orden.}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Orden actualizado, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PortfolioMedia'}}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /providers/me/media/{mediaId}:
    parameters:
      - {name: mediaId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete:
      tags: [Providers]
      operationId: deleteMedia
      summary: Eliminar medio del portafolio
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Eliminado}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /providers/me/verification-submission:
    post:
      tags: [Providers]
      operationId: submitProviderForReview
      summary: Enviar perfil a revisión de verificación
      description: Registra la evidencia declarada y deja el perfil en PENDIENTE para revisión administrativa (SRS-ADM-001). No cambia el estado de cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: array
                  items:
                    type: object
                    required: [type, reference]
                    properties:
                      type: {type: string, minLength: 1, maxLength: 60}
                      reference: {type: string, minLength: 1, maxLength: 500}
                    additionalProperties: false
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Enviado a revisión, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /catalog/categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Listar categorías y subtipos activos
      security: []
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Taxonomía, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Category'}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /catalog/providers:
    get:
      tags: [Catalog]
      operationId: searchProviders
      summary: Buscar proveedores elegibles
      security: []
      description: AND entre dimensiones de filtro y OR entre varios valores de una dimensión. Disponibilidad indicativa; reserva revalida. Endpoint público con rate limit por IP y paginación por cursor con limit máximo 50 (TEC-012); no devuelve datos de contacto (DEC-028).
      parameters:
        - {name: categoryId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: subtypeIds, in: query, schema: {type: array, items: {$ref: '#/components/schemas/UUID'}}}
        - {name: modality, in: query, schema: {$ref: '#/components/schemas/BookingModality'}}
        - {name: minPrice, in: query, schema: {type: string}}
        - {name: maxPrice, in: query, schema: {type: string}}
        - {name: minRating, in: query, schema: {type: number, minimum: 0, maximum: 5}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}, description: Texto libre en nombre y descripción}
        - {name: city, in: query, schema: {type: string}}
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radiusKm, in: query, schema: {type: integer, minimum: 1, maximum: 500}, description: Requiere latitude y longitude; filtra por cobertura del proveedor}
        - {name: eventDate, in: query, schema: {type: string, format: date}}
        - {name: minCapacity, in: query, schema: {type: integer, minimum: 1}}
        - {name: guests, in: query, schema: {type: integer, minimum: 1}}
        - {name: sort, in: query, schema: {type: string, enum: [PRICE_ASC, PRICE_DESC, RATING_DESC, VALUE_DESC, RECENT]}}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PublicLimit'}
      responses:
        '200': {description: Proveedores verificados y publicables, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderSearchPage'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /catalog/providers/{providerId}:
    get:
      tags: [Catalog]
      operationId: getPublicProvider
      summary: Consultar perfil público
      security: []
      parameters:
        - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Perfil público, content: {application/json: {schema: {$ref: '#/components/schemas/PublicProvider'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /catalog/providers/{providerId}/reviews:
    get:
      tags: [Catalog]
      operationId: listProviderReviews
      summary: Listar reseñas visibles de un proveedor
      description: Endpoint público, solo con reseñas en estado VISIBLE, ordenadas de la más reciente a la más antigua, con paginación por cursor y limit máximo 50 (TEC-012; SAD §11.1) y rate limit por IP. No expone reportes ni datos personales de quien reseñó (SRS-REV-008).
      security: []
      parameters:
        - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/PublicLimit'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Reseñas visibles, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewPage'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /quick-quotations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Quotations]
      operationId: listQuickQuotations
      summary: Listar cotizaciones rápidas guardadas
      parameters:
        - {name: favorite, in: query, schema: {type: boolean}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Cotizaciones rápidas, content: {application/json: {schema: {$ref: '#/components/schemas/QuickQuotationPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Quotations]
      operationId: createQuickQuotation
      summary: Generar cotización rápida
      description: Devuelve una tabla comparativa de hasta 20 opciones elegibles ordenadas por ranking; no requiere evento previo (SRS-QUO-001 a SRS-QUO-004).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuickQuotationInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Cotización rápida generada, content: {application/json: {schema: {$ref: '#/components/schemas/QuickQuotation'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quick-quotations/{quickQuotationId}/favorite:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quickQuotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Quotations]
      operationId: markQuickQuotationFavorite
      summary: Marcar cotización rápida como favorita
      description: SRS-QUO-010.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Marcada como favorita, content: {application/json: {schema: {$ref: '#/components/schemas/QuickQuotation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [Quotations]
      operationId: unmarkQuickQuotationFavorite
      summary: Quitar marca de favorita a cotización rápida
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Marca retirada, content: {application/json: {schema: {$ref: '#/components/schemas/QuickQuotation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /event-templates:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Events]
      operationId: listEventTemplates
      summary: Listar plantillas globales y privadas
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Plantillas, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplatePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Events]
      operationId: createEventTemplate
      summary: Crear plantilla privada
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Creada, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /event-templates/{templateId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: templateId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Events]
      operationId: getEventTemplate
      summary: Consultar plantilla
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantilla, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplate'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Events]
      operationId: updateEventTemplate
      summary: Actualizar plantilla privada
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplate'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {description: La versión cambió (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    delete:
      tags: [Events]
      operationId: deactivateEventTemplate
      summary: Desactivar plantilla privada
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Desactivada}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Events]
      operationId: listEvents
      summary: Listar eventos del tenant
      parameters:
        - {name: coordinatorId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: includeArchived, in: query, schema: {type: boolean, default: false}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/EventStatus'}}
        - {name: from, in: query, schema: {type: string, format: date}}
        - {name: to, in: query, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Eventos, content: {application/json: {schema: {$ref: '#/components/schemas/EventPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Events]
      operationId: createEvent
      summary: Crear evento
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Evento BORRADOR, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /events/{eventId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Events]
      operationId: getEvent
      summary: Consultar evento
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Evento, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Actualizar evento
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventUpdate'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      responses:
        '200': {description: Actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {description: La versión cambió (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /events/{eventId}/clone:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Events]
      operationId: cloneEvent
      summary: Clonar evento sin transacciones previas
      parameters:
        - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localStartsAt, localEndsAt]
              properties:
                name: {type: [string, 'null']}
                localStartsAt: {$ref: '#/components/schemas/LocalDateTime'}
                localEndsAt: {$ref: '#/components/schemas/LocalDateTime'}
                timeZone: {type: [string, 'null']}
                guests: {type: integer, minimum: 1}
                location: {$ref: '#/components/schemas/EventLocation'}
              additionalProperties: false
      responses:
        '201': {description: Nuevo evento, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /events/{eventId}/status:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    patch:
      tags: [Events]
      operationId: transitionEventStatus
      summary: Cambiar estado mediante transición permitida
      parameters:
        - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/EventStatus'}
                reason: {type: [string, 'null']}
              additionalProperties: false
      responses:
        '200': {description: Estado actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/{eventId}/assignees:
    get:
      tags: [Events]
      operationId: getEventAssignees
      summary: Consultar coordinadores restringidos asignados
      description: |
        PROPIETARIO o ADMIN_EMPRESA (SRS-AUTH-011).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Asignaciones, content: {application/json: {schema: {$ref: '#/components/schemas/EventAssignees'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    put:
      tags: [Events]
      operationId: setEventAssignees
      summary: Reemplazar coordinadores restringidos asignados al evento
      description: Solo PROPIETARIO o ADMIN_EMPRESA (SRS-AUTH-011). Cada membresía debe ser COORDINADOR_RESTRINGIDO activa de la misma empresa. Reemplaza la lista completa; una lista vacía retira todas las asignaciones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [membershipIds]
              properties:
                membershipIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Asignaciones actualizadas, content: {application/json: {schema: {$ref: '#/components/schemas/EventAssignees'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /events/{eventId}/quotations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Quotations]
      operationId: createQuotation
      summary: Generar cotización integral del evento
      description: Cuerpo opcional con plantilla y categorías a incluir (SRS-EVT-003). Si se envía, items es obligatorio.
      parameters:
        - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                templateId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
                items: {type: array, items: {$ref: '#/components/schemas/QuotationItemInput'}}
              additionalProperties: false
      responses:
        '201': {description: Cotización generada, content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /quotations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Quotations]
      operationId: listQuotations
      summary: Listar cotizaciones
      parameters:
        - {name: eventId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/QuotationStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Cotizaciones, content: {application/json: {schema: {$ref: '#/components/schemas/QuotationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quotations/{quotationId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Quotations]
      operationId: getQuotation
      summary: Consultar cotización y snapshots
      parameters:
        - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Cotización, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    patch:
      tags: [Quotations]
      operationId: updateQuotationSelections
      summary: Actualizar selección preliminar y recalcular totales
      parameters:
        - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/IfMatch'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selections]
              properties:
                selections:
                  type: array
                  items:
                    type: object
                    required: [quotationItemId, packageId]
                    properties:
                      quotationItemId: {$ref: '#/components/schemas/UUID'}
                      packageId: {$ref: '#/components/schemas/UUID'}
              additionalProperties: false
      responses:
        '200': {description: Cotización recalculada, content: {application/json: {schema: {$ref: '#/components/schemas/Quotation'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {description: La versión cambió (PRECONDITION_FAILED), content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /quotations/{quotationId}/pdf:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Quotations]
      operationId: requestQuotationPdf
      summary: Solicitar PDF basado en snapshot
      parameters:
        - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '202': {description: Trabajo aceptado, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quotations/{quotationId}/items:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Quotations]
      operationId: addQuotationItem
      summary: Añadir ítem a la cotización
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QuotationItemInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Ítem añadido, content: {application/json: {schema: {$ref: '#/components/schemas/QuotationItem'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quotations/{quotationId}/items/{itemId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    delete:
      tags: [Quotations]
      operationId: removeQuotationItem
      summary: Retirar ítem de la cotización
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Ítem retirado}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /documents/{documentId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Quotations]
      operationId: getDocument
      summary: Consultar estado y URL temporal protegida
      parameters:
        - {name: documentId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Estado documento, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /bookings:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Bookings]
      operationId: listBookings
      summary: Listar reservas/contrataciones
      description: Un proveedor con cuenta suspendida solo ve sus contrataciones vigentes (SRS-AUTH-007; DEC-036).
      parameters:
        - {name: eventId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: providerId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/BookingStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Reservas, content: {application/json: {schema: {$ref: '#/components/schemas/BookingPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /bookings/instant:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Bookings]
      operationId: createInstantBooking
      summary: Confirmar reserva Instant Book
      description: |
        Caso de uso ConfirmBooking (TEC-009): transacción PostgreSQL atómica que revalida proveedor, paquete y precio,
        bloquea y consume la capacidad global (2 por defecto) y la del paquete en cada fecha local del servicio
        (SRS-EVT-010). Fecha, horario e invitados se derivan del evento. Sin capacidad responde 409 CAPACITY_EXHAUSTED.
        Idempotency-Key evita duplicados. No procesa pagos ni anticipos.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventId, quotationItemId, packageId]
              properties:
                eventId: {$ref: '#/components/schemas/UUID'}
                quotationItemId: {$ref: '#/components/schemas/UUID'}
                packageId: {$ref: '#/components/schemas/UUID'}
                quantity: {type: integer, minimum: 1, default: 1, description: Unidades de capacidad del paquete (DEC-006); 1 salvo paquetes con capacidad propia}
                acceptedScope: {type: [string, 'null'], maxLength: 4000}
              additionalProperties: false
      responses:
        '201': {description: Reserva confirmada con snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /bookings/{bookingId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Consultar reserva y snapshot
      description: Un proveedor con cuenta suspendida solo consulta sus contrataciones vigentes; las demás responden 403 (SRS-AUTH-007; DEC-036).
      parameters:
        - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Reserva, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /bookings/{bookingId}/cancellation:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Bookings]
      operationId: recordBookingCancellation
      summary: Registrar cancelación con motivo
      description: |
        Política por etapas (DEC-001). Con la reserva confirmada y el servicio no iniciado, cualquiera de las partes solicita
        la cancelación con motivo; la contraparte la acepta o disputa mediante /bookings/{bookingId}/cancellation/response.
        No calcula penalidades ni reembolsos. Servicio iniciado o completado no admite cancelación ordinaria (409).
        Se registran actor, fecha, motivo, estado anterior y nuevo, y evidencia si existe.
      parameters:
        - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
                evidenceUrl: {type: [string, 'null'], format: uri}
              additionalProperties: false
      responses:
        '200': {description: Cancelación solicitada y pendiente de respuesta de la contraparte, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bookings/{bookingId}/cancellation/response:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Bookings]
      operationId: respondBookingCancellation
      summary: Aceptar o disputar una cancelación solicitada
      description: |
        ACEPTAR cambia la reserva a CANCELADO y libera la capacidad de forma transaccional. DISPUTAR la pasa a
        CANCELACION_EN_REVISION y no libera capacidad hasta que la administración la resuelva (DEC-001). RETIRAR, solo
        para quien solicitó la cancelación, la retira y devuelve la reserva a CONFIRMADO (SRS-BOOK-009).
        Un proveedor con cuenta suspendida puede responder las cancelaciones de sus contrataciones que sigan en curso (SRS-AUTH-007; DEC-036).
      parameters:
        - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [ACEPTAR, DISPUTAR, RETIRAR]}
                reason: {type: [string, 'null'], maxLength: 1000}
              additionalProperties: false
      responses:
        '200': {description: Respuesta registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bookings/{bookingId}/suspension-review/decision:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Bookings]
      operationId: decideSuspensionReview
      summary: Elegir entre mantener o cancelar una contratación en revisión por suspensión del proveedor
      description: |
        Solo sobre una contratación en CANCELACION_EN_REVISION con reviewOrigin PLATAFORMA (SRS-ADM-013, DEC-034). La usan
        los roles de la organizadora que pueden cancelar contrataciones (SRS-AUTH-009). CANCELAR pasa la contratación a
        CANCELADO y libera la capacidad de forma transaccional. MANTENER registra la elección y la contratación sigue en
        revisión hasta que la administración la resuelva con resolveBookingDispute.
        La ventana termina en lo primero entre 72 h tras la suspensión y el inicio del servicio (reviewDecisionDueAt);
        MANTENER puede cambiarse a CANCELAR mientras siga abierta (DEC-036). Fuera de la ventana, o en otro
        estado u origen, responde 409 INVALID_STATE_TRANSITION (DEC-036).
      parameters:
        - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {$ref: '#/components/schemas/SuspensionReviewDecision'}
                reason: {type: [string, 'null'], maxLength: 1000}
              additionalProperties: false
      responses:
        '200': {description: Elección registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/completion:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Bookings]
      operationId: recordBookingCompletion
      summary: Marcar servicio realizado, confirmarlo o reportar incidencia
      description: |
        El proveedor marca el servicio como realizado (MARCAR_REALIZADO → SERVICIO_REALIZADO). El organizador lo confirma
        (CONFIRMAR → COMPLETADO) o reporta una incidencia (REPORTAR_INCIDENCIA → INCIDENCIA) dentro de 5 días calendario; sin
        respuesta ni incidencia, el sistema cierra automáticamente. Al cerrarse la comisión pasa a DEVENGADA; con incidencia
        queda RETENIDA (DEC-002, SRS-BOOK-009/010).
        Un proveedor con cuenta suspendida solo conserva MARCAR_REALIZADO sobre sus contrataciones en curso (SRS-AUTH-007; DEC-036).
      parameters:
        - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [MARCAR_REALIZADO, CONFIRMAR, REPORTAR_INCIDENCIA]}
                notes: {type: [string, 'null'], maxLength: 2000}
              additionalProperties: false
      responses:
        '200': {description: Cierre registrado, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /quotations/{quotationId}/items/{itemId}/rfq-cycles:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: createRfqCycle
      summary: Crear ronda e-RFQ de uno a cinco proveedores
      description: Nueva ronda (RfqCycle, TEC-002; DEC-026); ruta /rfq-cycles desde v1.1.0 (ver nota de versión en info). Crea solicitudes independientes; despachos asíncronos y fallos aislados por proveedor.
      parameters:
        - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerIds, slaHours]
              properties:
                providerIds: {type: array, minItems: 1, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
                slaHours: {type: integer, enum: [6, 12, 24, 48]}
                channel: {type: string, enum: [EMAIL_FORM, WHATSAPP, AMBOS], default: EMAIL_FORM}
                scope: {type: string, minLength: 1, maxLength: 6000}
              additionalProperties: false
      responses:
        '202': {description: Lote aceptado, content: {application/json: {schema: {$ref: '#/components/schemas/RfqBatch'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rfq-requests:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [RFQ]
      operationId: listRfqRequests
      summary: Listar solicitudes RFQ accesibles
      parameters:
        - {name: eventId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: quotationItemId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/RfqStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Solicitudes, content: {application/json: {schema: {$ref: '#/components/schemas/RfqRequestPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rfq-requests/{requestId}:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [RFQ]
      operationId: getRfqRequest
      summary: Consultar solicitud y despacho
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Solicitud, content: {application/json: {schema: {$ref: '#/components/schemas/RfqRequest'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rfq-requests/{requestId}/whatsapp-link:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: buildWhatsappClickToChat
      summary: Construir enlace wa.me con texto prellenado
      description: No envía ni entrega el mensaje. El usuario debe enviarlo desde WhatsApp; no hay webhook entrante en MVP.
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Sin plantilla indicada se usa la privada de la categoría si existe y, si no, la global.
              properties:
                templateId: {$ref: '#/components/schemas/UUID'}
              additionalProperties: false
      responses:
        '200':
          description: Enlace listo para abrir; estado de entrega NO_ENVIADO. Revela el número del proveedor a esta empresa y queda auditado (DEC-028).
          content:
            application/json:
              schema:
                type: object
                required: [url, message, deliveryStatus]
                properties:
                  url: {type: string, format: uri}
                  message: {type: string}
                  deliveryStatus: {type: string, const: NO_ENVIADO}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/ValidationError'}
  /rfq-requests/{requestId}/assisted-response/prompt:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Assisted Responses]
      operationId: createAssistedResponsePrompt
      summary: Generar prompt desde texto pegado manualmente
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rawMessage]
              properties:
                rawMessage: {type: string, minLength: 1, maxLength: 12000}
              additionalProperties: false
      responses:
        '200': {description: Prompt para herramienta externa, content: {application/json: {schema: {type: object, properties: {prompt: {type: string}, schemaVersion: {type: string, const: '1.0'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rfq-requests/{requestId}/assisted-response/validate:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Assisted Responses]
      operationId: validateAssistedResponse
      summary: Validar JSON importado sin crear oferta
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssistedResponseInput'}
      responses:
        '200':
          description: Resultado de validación; aún no modifica estado transaccional.
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: {type: boolean}
                  errors: {type: array, items: {type: string}}
                  normalized: {$ref: '#/components/schemas/AssistedResponseInput'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rfq-requests/{requestId}/assisted-response/confirm:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Assisted Responses]
      operationId: confirmAssistedResponse
      summary: Confirmar manualmente respuesta asistida
      description: Requiere revisión humana explícita; IA no adjudica ni reserva.
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response, humanReviewed]
              properties:
                response: {$ref: '#/components/schemas/AssistedResponseInput'}
                humanReviewed: {type: boolean, const: true}
              additionalProperties: false
      responses:
        '201': {description: Oferta registrada con origen WHATSAPP_IA_ASISTIDO, content: {application/json: {schema: {$ref: '#/components/schemas/RfqOffer'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /assisted-response/schema:
    get:
      tags: [Assisted Responses]
      operationId: getAssistedResponseSchema
      summary: Consultar JSON Schema de la respuesta asistida
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: JSON Schema v1.0 de AssistedResponseInput, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rfq-requests/{requestId}/offers/revisions:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: reviseRfqOffer
      summary: Crear una revisión de la oferta como proveedor autenticado
      description: |
        Una oferta enviada es inmutable (DEC-005, TEC-001). Mientras la solicitud siga abierta y no exista adjudicación, el
        proveedor crea una revisión con motivo y confirma que reemplaza el precio/alcance anterior; la previa queda REEMPLAZADA.
        Tras vencer el SLA no procede: una nueva oferta requiere una nueva ronda (DEC-026); tras adjudicar se rechaza con 409.
        Puede usarse para renovar la vigencia de una oferta vencida mientras la solicitud siga abierta (SRS-RFQ-012).
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response, reason, confirmsReplacement]
              properties:
                response: {$ref: '#/components/schemas/RfqResponseInput'}
                reason: {type: string, minLength: 1, maxLength: 1000}
                confirmsReplacement: {type: boolean, const: true}
              additionalProperties: false
      responses:
        '201': {description: Nueva revisión registrada, content: {application/json: {schema: {$ref: '#/components/schemas/RfqOffer'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rfq-requests/{requestId}/offers:
    get:
      tags: [RFQ]
      operationId: listRfqOffers
      summary: Listar las ofertas de una solicitud
      description: |
        Revisiones de la solicitud, de la más reciente a la más antigua. La usan el proveedor destinatario y los miembros de la empresa propietaria; nunca expone ofertas de otros proveedores (SRS-RFQ-007).
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Ofertas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RfqOffer'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: submitProviderPortalOffer
      summary: Enviar oferta desde el portal del proveedor
      description: Proveedor autenticado responde la solicitud e-RFQ con origen PORTAL_PROVEEDOR. Una oferta enviada es inmutable; sus cambios van por /offers/revisions (DEC-005, TEC-001).
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RfqResponseInput'}
      responses:
        '201': {description: Oferta registrada con origen PORTAL_PROVEEDOR, content: {application/json: {schema: {$ref: '#/components/schemas/RfqOffer'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /magic-links/form:
    post:
      tags: [Magic Links]
      operationId: getMagicLinkForm
      summary: Consultar resumen mínimo de solicitud
      security: []
      description: |
        Token de capacidad limitada y un solo uso; no concede sesión ni acceso general. El token viaja en el cuerpo, nunca en la
        ruta ni en la query: el email enlaza a /r#<token> y la página lo lee del fragmento (TEC-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, minLength: 32, maxLength: 512}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200':
          description: Datos mínimos para responder.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MagicLinkForm'}
        '400': {$ref: '#/components/responses/MagicLinkValidationError'}
        '404': {$ref: '#/components/responses/MagicLinkNotFound'}
        '429': {$ref: '#/components/responses/MagicLinkRateLimited'}
  /magic-links/response:
    post:
      tags: [Magic Links]
      operationId: submitMagicLinkResponse
      summary: Responder solicitud e-RFQ
      security: []
      description: Consumo del token y creación de oferta en una transacción; acepta received_at <= sla_expira_at. Token en el cuerpo (TEC-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, response]
              properties:
                token: {type: string, minLength: 32, maxLength: 512}
                response: {$ref: '#/components/schemas/RfqResponseInput'}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201':
          description: Oferta creada y token consumido
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
            Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RfqOffer'}
        '400': {$ref: '#/components/responses/MagicLinkValidationError'}
        '404': {$ref: '#/components/responses/MagicLinkNotFound'}
        '409': {$ref: '#/components/responses/MagicLinkConflict'}
        '429': {$ref: '#/components/responses/MagicLinkRateLimited'}
  /rfq-requests/{requestId}/reject:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: rejectRfqRequest
      summary: Rechazar solicitud como proveedor autenticado
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: [string, 'null'], maxLength: 1000}
              additionalProperties: false
      responses:
        '200': {description: Solicitud rechazada, content: {application/json: {schema: {$ref: '#/components/schemas/RfqRequest'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /rfq-requests/{requestId}/cancel:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: cancelRfqRequest
      summary: Cancelar solicitud e-RFQ
      description: Revocación de la solicitud por el organizador; pasa a CANCELADO (SRS-RFQ-013).
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
              additionalProperties: false
      responses:
        '200': {description: Solicitud cancelada, content: {application/json: {schema: {$ref: '#/components/schemas/RfqRequest'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /rfq-requests/{requestId}/retry:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: retryRfqDispatch
      summary: Reintentar despacho de la solicitud e-RFQ
      description: Reintento de envío de una solicitud en ERROR_ENVIO, hasta 3 veces (SRS-RFQ-013, DEC-026).
      parameters:
        - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '202': {description: Reintento aceptado, content: {application/json: {schema: {$ref: '#/components/schemas/RfqRequest'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quotations/{quotationId}/items/{itemId}/award:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [RFQ]
      operationId: awardRfqOffer
      summary: Adjudicar una oferta de forma atómica
      description: Solo un ganador por ítem; la oferta debe estar vigente. Invoca ConfirmBooking en la misma transacción (TEC-009) y responde 409 CAPACITY_EXHAUSTED si el proveedor no tiene capacidad. Crea contratación/snapshot e inserta las notificaciones en el outbox en la misma transacción (SAD §7.4). No disponible para COORDINADOR_RESTRINGIDO.
      parameters:
        - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerId]
              properties:
                offerId: {$ref: '#/components/schemas/UUID'}
              additionalProperties: false
      responses:
        '200': {description: Contratación adjudicada, content: {application/json: {schema: {$ref: '#/components/schemas/Booking'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /quotations/{quotationId}/items/{itemId}/bid-tabulation:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [RFQ]
      operationId: getBidTabulation
      summary: Consultar tabulación de ofertas del ítem
      description: Estructura homogénea con las columnas de SRS-RFQ-008 sin alterar el contenido original; incluye revisiones y marca expiradas las ofertas vencidas.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Tabulación, content: {application/json: {schema: {$ref: '#/components/schemas/BidTabulation'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /quotations/{quotationId}/items/{itemId}/alternatives:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [RFQ]
      operationId: listRfqAlternatives
      summary: Listar proveedores alternativos sugeridos
      description: Proveedores elegibles de la misma categoría/subtipo para reemplazar solicitudes rechazadas, vencidas o canceladas (SRS-RFQ-010). La reinvitación requiere confirmación del organizador.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Alternativas sugeridas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RfqAlternative'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /quotations/{quotationId}/items/{itemId}/tracking:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Quotations]
      operationId: getItemTracking
      summary: Consultar estado de seguimiento e historial del ítem
      description: Estado individual del servicio y transiciones auditadas (SRS-TRK-001, SRS-TRK-002).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Seguimiento del ítem, content: {application/json: {schema: {$ref: '#/components/schemas/ItemTracking'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Quotations]
      operationId: transitionItemTracking
      summary: Aplicar transición explícita de seguimiento
      description: Transición validada en backend y auditada con actor, estado anterior, nuevo y motivo (SRS-TRK-003). Solo registra una transición cuyo hecho de negocio ya existe (SRS §9.3). No admite saltos como COTIZADO a CALIFICADO.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ItemTrackingTransition'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Transición aplicada, content: {application/json: {schema: {$ref: '#/components/schemas/ItemTracking'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reviews:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    post:
      tags: [Reviews]
      operationId: createReview
      summary: Calificar proveedor con contratación completada
      description: Cuatro dimensiones enteras 1-5 (SRS-REV-002); el promedio lo calcula el dominio. Ventana de 30 días desde COMPLETADO; no editable (SRS-REV-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, punctuality, serviceQuality, communication, valueForMoney]
              properties:
                bookingId: {$ref: '#/components/schemas/UUID'}
                punctuality: {$ref: '#/components/schemas/RatingScore'}
                serviceQuality: {$ref: '#/components/schemas/RatingScore'}
                communication: {$ref: '#/components/schemas/RatingScore'}
                valueForMoney: {$ref: '#/components/schemas/RatingScore'}
                comment: {type: [string, 'null'], maxLength: 500}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Reseña creada, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /reviews/{reviewId}/response:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    put:
      tags: [Reviews]
      operationId: respondToReview
      summary: Responder reseña propia
      parameters:
        - {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response: {type: string, minLength: 1, maxLength: 300}
              additionalProperties: false
      responses:
        '200': {description: Respuesta registrada, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /reviews/{reviewId}/reports:
    parameters:
      - {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Reviews]
      operationId: reportReview
      summary: Reportar reseña
      description: Pueden reportar el proveedor afectado y ADMIN_PLATAFORMA. Un mismo actor no puede reportar dos veces la misma reseña (SRS-REV-008). El reporte entra en la cola de moderación (SRS-REV-007).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {$ref: '#/components/schemas/ReviewReportReason'}
                details: {type: [string, 'null'], maxLength: 1000}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Reporte registrado, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewReport'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Consultar notificaciones propias
      parameters:
        - {name: unreadOnly, in: query, schema: {type: boolean, default: false}}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Notificaciones, content: {application/json: {schema: {$ref: '#/components/schemas/NotificationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /notifications/{notificationId}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Marcar notificación como leída
      parameters:
        - {name: notificationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Leída}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /webhooks/sendgrid/events:
    post:
      tags: [Notifications]
      operationId: receiveSendgridEvents
      summary: Recibir eventos de entrega de SendGrid
      description: Verifica firma y es idempotente por sg_event_id (SRS-NOT-006). Actualiza dispatchStatus de la notificación o de la solicitud e-RFQ asociada. La aceptación por el proveedor de correo no equivale a entrega.
      security: []
      parameters:
        - {name: X-Twilio-Email-Event-Webhook-Signature, in: header, required: true, schema: {type: string}}
        - {name: X-Twilio-Email-Event-Webhook-Timestamp, in: header, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: {type: object, additionalProperties: true, description: Evento externo de SendGrid; el contrato no fija sus campos.}
      responses:
        '204': {description: Eventos aceptados}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {description: Firma o marca temporal inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/providers:
    get:
      tags: [Admin]
      operationId: listProvidersForAdmin
      summary: Listar proveedores para administración
      description: Filtros combinables por estado de verificación y estado de cuenta (DEC-031). Paginado.
      parameters:
        - {name: verificationStatus, in: query, schema: {$ref: '#/components/schemas/VerificationStatus'}}
        - {name: accountStatus, in: query, schema: {$ref: '#/components/schemas/AccountStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Proveedores paginados, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderAdminPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/providers/{providerId}/verification:
    patch:
      tags: [Admin]
      operationId: updateProviderVerification
      summary: Verificar o rechazar proveedor
      parameters:
        - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [PENDIENTE, VERIFICADO, RECHAZADO]}
                verificationLevel: {type: integer, minimum: 1, maximum: 3, description: 'Nivel alcanzado (DEC-009): 1 identidad y contacto, 2 actividad comercial, 3 evidencia del servicio.'}
                evidenceReviewed: {type: array, items: {type: object, required: [type, result], properties: {type: {type: string}, result: {type: string, enum: [APROBADA, RECHAZADA]}, expiresAt: {type: [string, 'null'], format: date}}}, description: Evidencia revisada; se registra revisor, fecha, resultado y vencimiento sin almacenar documentos de identidad completos.}
                reason: {type: [string, 'null'], maxLength: 1000}
              additionalProperties: false
      responses:
        '200': {description: Estado actualizado y auditado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/providers/{providerId}/suspension:
    patch:
      tags: [Admin]
      operationId: setProviderSuspension
      summary: Suspender o reactivar proveedor
      description: |
        Suspender exige motivo (SRS-ADM-005) y aplica en una sola transacción (DEC-036) los efectos de SRS-ADM-013 (DEC-034): revoca
        solicitudes e-RFQ abiertas, invalida ofertas no adjudicadas y Magic Links, y pasa las contrataciones futuras a
        CANCELACION_EN_REVISION con reviewOrigin PLATAFORMA. Reactivar no restaura contrataciones canceladas.
      parameters:
        - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [suspended]
              properties:
                suspended: {type: boolean}
                reason: {type: [string, 'null']}
              additionalProperties: false
      responses:
        '200': {description: Estado actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Provider'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/organizations/{organizationId}/plan:
    parameters:
      - {name: organizationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: setOrganizationPlan
      summary: Asignar o cambiar plan de empresa
      description: Solo ADMIN_PLATAFORMA (SRS-ADM-009, SRS-TEN-004). Asigna el plan con fecha de inicio y fin; el cambio queda auditado. No hay cobro recurrente automatizado en el MVP (SRS-TEN-003).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, validFrom]
              properties:
                planCode: {$ref: '#/components/schemas/PlanCode'}
                validFrom: {type: string, format: date-time}
                validUntil: {type: [string, 'null'], format: date-time}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plan asignado, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/organizations/{organizationId}/suspension:
    parameters:
      - {name: organizationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: setOrganizationSuspension
      summary: Suspender o reactivar empresa
      description: Solo ADMIN_PLATAFORMA (SRS-ADM-005). El motivo es obligatorio al suspender y la acción queda auditada.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuspensionInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Estado de empresa actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/users/{userId}/suspension:
    parameters:
      - {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: setUserSuspension
      summary: Suspender o reactivar usuario
      description: Solo ADMIN_PLATAFORMA (SRS-AUTH-007, SRS-ADM-005). El motivo es obligatorio al suspender y la acción queda auditada.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SuspensionInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Estado de usuario actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/CurrentUser'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/categories:
    get:
      tags: [Admin]
      operationId: listCategoriesForAdmin
      summary: Listar categorías y subtipos, incluidos los inactivos
      description: |
        SRS-ADM-002.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Taxonomía completa, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Category'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: createCategory
      summary: Crear categoría de catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string, maxLength: 30}
                name: {type: string, maxLength: 120}
                active: {type: boolean, default: true}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Categoría creada, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/categories/{categoryId}:
    parameters:
      - {name: categoryId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updateCategory
      summary: Editar o activar/desactivar categoría
      description: El código de la categoría es estable y no es editable. Los cambios conservan referencias históricas (SRS-ADM-002).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryUpdate'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Categoría actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/subtypes:
    post:
      tags: [Admin]
      operationId: createSubtype
      summary: Crear subtipo en categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoryId, name]
              properties:
                categoryId: {$ref: '#/components/schemas/UUID'}
                name: {type: string, maxLength: 120}
                active: {type: boolean, default: true}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Subtipo creado, content: {application/json: {schema: {$ref: '#/components/schemas/Subtype'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/subtypes/{subtypeId}:
    parameters:
      - {name: subtypeId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updateSubtype
      summary: Editar o activar/desactivar subtipo
      description: Los cambios conservan referencias históricas (SRS-ADM-002).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubtypeUpdate'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Subtipo actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Subtype'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/event-templates:
    get:
      tags: [Admin]
      operationId: listGlobalEventTemplates
      summary: Listar plantillas globales, incluidas las inactivas
      description: |
        No requiere organización activa (SRS-ADM-003).
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantillas globales, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplatePage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: createGlobalEventTemplate
      summary: Crear plantilla global de evento
      description: Plantilla global administrada por ADMIN_PLATAFORMA (SRS-ADM-003).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Plantilla global creada, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplate'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/event-templates/{templateId}:
    parameters:
      - {name: templateId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updateGlobalEventTemplate
      summary: Editar o desactivar plantilla global de evento
      description: Los cambios no alteran plantillas ya copiadas por empresas ni eventos existentes (SRS-ADM-003).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantilla global actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/EventTemplate'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/whatsapp-templates:
    get:
      tags: [Admin]
      operationId: listWhatsappTemplates
      summary: Listar plantillas globales WhatsApp
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantillas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/WhatsappTemplate'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: createWhatsappTemplate
      summary: Crear plantilla global WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WhatsappTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '201': {description: Plantilla creada, content: {application/json: {schema: {$ref: '#/components/schemas/WhatsappTemplate'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/whatsapp-templates/{templateId}:
    parameters:
      - {name: templateId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updateWhatsappTemplate
      summary: Editar plantilla global WhatsApp
      description: Las copias privadas de empresa no cambian al editar la versión global (SRS-ADM-004).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WhatsappTemplateInput'}
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantilla global actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/WhatsappTemplate'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/review-reports:
    get:
      tags: [Admin]
      operationId: listReviewReports
      summary: Listar reportes de reseñas
      description: Cola de moderación paginada (SRS-ADM-006, SRS-REV-007).
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Reportes paginados, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewReportPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/review-reports/{reportId}:
    parameters:
      - {name: reportId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: resolveReviewReport
      summary: Resolver reporte de reseña
      description: Registra la decisión y el motivo. Ocultar conserva la reseña y el registro de moderación (SRS-ADM-006, SRS-REV-007).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [OCULTAR, MANTENER]}
                reason: {type: string, minLength: 1, maxLength: 1000}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Reporte resuelto, content: {application/json: {schema: {$ref: '#/components/schemas/ReviewReport'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/disputes:
    get:
      tags: [Admin]
      operationId: listDisputes
      summary: Listar reservas con cancelación en revisión o incidencia
      description: Bookings en CANCELACION_EN_REVISION o INCIDENCIA (DEC-001, DEC-002), con el origen de la revisión y, si es PLATAFORMA, la elección de la organizadora y el fin de su ventana (SRS-ADM-010).
      parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}, {$ref: '#/components/parameters/CorrelationId'}]
      responses:
        '200': {description: Disputas paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/DisputePage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/bookings/{bookingId}/resolution:
    parameters:
      - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Admin]
      operationId: resolveBookingDispute
      summary: Resolver disputa de reserva
      description: |
        Registra la decisión con motivo y auditoría. Aplica solo las transiciones permitidas por la máquina de estados de la
        contratación (SRS-BOOK-009). En una revisión con reviewOrigin PLATAFORMA, solo se admite después de que la
        organizadora elija MANTENER o de que se cierre su ventana de decisión; antes responde 409 INVALID_STATE_TRANSITION
        (SRS-ADM-013; DEC-036).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {$ref: '#/components/schemas/DisputeDecision'}
                reason: {type: string, minLength: 1, maxLength: 1000}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Disputa resuelta, content: {application/json: {schema: {$ref: '#/components/schemas/DisputeResolution'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/commissions/export:
    get:
      tags: [Admin]
      operationId: exportCommissions
      summary: Exportar comisiones del periodo en CSV
      description: Comisiones DEVENGADA y REVERTIDA del periodo para facturación externa y conciliación manual (SRS-ADM-008, DEC-033).
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}$'}, description: 'Periodo año-mes, p. ej. 2026-11.'}
        - {name: format, in: query, schema: {type: string, enum: [CSV], default: CSV}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Exportación CSV, content: {text/csv: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/commissions/{commissionId}/reversal:
    parameters:
      - {name: commissionId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Admin]
      operationId: reverseCommission
      summary: Revertir comisión
      description: Registra la reversión con motivo y auditoría (SRS-ADM-008).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Comisión revertida, content: {application/json: {schema: {$ref: '#/components/schemas/CommissionRecord'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/data-requests:
    get:
      tags: [Admin]
      operationId: listDataSubjectRequests
      summary: Listar solicitudes de titulares de datos
      parameters:
        - {name: status, in: query, schema: {$ref: '#/components/schemas/DataRequestStatus'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Solicitudes paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDataSubjectRequestPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/data-requests/{requestId}:
    parameters:
      - {name: requestId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: resolveDataSubjectRequest
      summary: Actualizar o resolver solicitud de titular
      description: |
        Registra responsable, fecha y resultado (SRS-NFR-PRIV-002). La supresión respeta la retención obligatoria y el legal_hold (DEC-003).
        Con extendDueDate true (solo con status EN_TRAMITE) concede la prórroga única: resolution contiene el motivo que se
        informa al titular y la respuesta devuelve extendedDueDate (SRS-ADM-012; DEC-037). Pedirla vencido el
        primer plazo o por segunda vez responde 409 INVALID_STATE_TRANSITION (DEC-037).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution]
              properties:
                status: {type: string, enum: [EN_TRAMITE, RESUELTA, RECHAZADA]}
                resolution: {type: string, minLength: 1, maxLength: 2000}
                extendDueDate: {type: boolean, default: false}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Solicitud actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDataSubjectRequest'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/legal-holds/{resourceType}/{resourceId}:
    parameters:
      - {name: resourceType, in: path, required: true, schema: {$ref: '#/components/schemas/LegalHoldResourceType'}, description: Tipo de recurso retenido (DEC-003).}
      - {name: resourceId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    put:
      tags: [Admin]
      operationId: setLegalHold
      summary: Activar retención legal sobre un recurso
      description: Impide el borrado lógico o la supresión del recurso mientras la retención esté activa (DEC-003).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 1000}
              additionalProperties: false
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Retención activa, content: {application/json: {schema: {$ref: '#/components/schemas/LegalHold'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    delete:
      tags: [Admin]
      operationId: releaseLegalHold
      summary: Liberar retención legal
      parameters:
        - {name: reason, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 1000}, description: Motivo registrado en auditoría.}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '204': {description: Retención liberada}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: Consultar indicadores del panel administrativo
      description: Indicadores agregados del MVP (SRS-ADM-007).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Indicadores, content: {application/json: {schema: {$ref: '#/components/schemas/AdminDashboard'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: searchAuditLogs
      summary: Consultar auditoría autorizada
      parameters:
        - {name: organizationId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: action, in: query, schema: {type: string, maxLength: 100}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: actorId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: resourceType, in: query, schema: {type: string}}
        - {$ref: '#/components/parameters/CorrelationId'}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200': {description: Auditoría paginada, content: {application/json: {schema: {$ref: '#/components/schemas/AuditLogPage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /catalog/providers/{providerId}/availability:
    get:
      tags: [Catalog]
      operationId: getPublicProviderAvailability
      summary: Consultar disponibilidad indicativa de un proveedor
      description: |
        Calendario público del perfil (PRD §11.2; SRS-CAT-009). Indicativo: no bloquea cupo y no expone capacidades ni reservas.
        El rango from..to admite como máximo 62 días; un rango mayor o invertido responde 400.
      security: []
      parameters:
        - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Disponibilidad por fecha, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PublicAvailabilityDay'}}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /plans:
    get:
      tags: [Catalog]
      operationId: listPublicPlans
      summary: Listar planes vigentes
      description: |
        Planes activos y vigentes para la página pública (DEC-029; PRD §14.1). No inicia ningún cobro.
      security: []
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Planes vigentes, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PublicPlan'}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /organizations/current/invitations:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: listInvitations
      summary: Listar invitaciones
      description: |
        PROPIETARIO o ADMIN_EMPRESA; incluye pendientes, vencidas y revocadas (SRS-AUTH-006).
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [PENDIENTE, ACEPTADA, EXPIRADA, REVOCADA]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Invitaciones paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /events/{eventId}/reactivate:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: eventId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Events]
      operationId: reactivateEvent
      summary: Reactivar un evento archivado
      description: |
        Quita archivedAt de un borrador archivado si no hay conflicto (SRS-EVT-007). Responde 409 INVALID_STATE_TRANSITION si no está archivado o hay conflicto, y 409 PLAN_LIMIT_REACHED si excede el plan.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Evento reactivado, content: {application/json: {schema: {$ref: '#/components/schemas/Event'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/history:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Bookings]
      operationId: getBookingHistory
      summary: Consultar el historial de la contratación
      description: |
        Transiciones en orden cronológico (SRS-BOOK-009). Accesible para la empresa propietaria y el proveedor contratado.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Historial, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BookingStatusEntry'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /bookings/{bookingId}/change-proposals:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Bookings]
      operationId: listBookingChangeProposals
      summary: Listar modificaciones propuestas
      description: |
        SRS-BOOK-005; SRS-EVT-008.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Propuestas, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/BookingChangeProposal'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Bookings]
      operationId: proposeBookingChange
      summary: Proponer una modificación de alcance o precio
      description: |
        Cualquiera de las partes propone; el acuerdo original no cambia hasta que la contraparte acepte (SRS-BOOK-005, entrega E2).
        Solo sobre una contratación CONFIRMADO o EN_PROGRESO y sin otra propuesta PENDIENTE; en otro caso 409 INVALID_STATE_TRANSITION.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingChangeProposalInput'}
      responses:
        '201': {description: Propuesta registrada, content: {application/json: {schema: {$ref: '#/components/schemas/BookingChangeProposal'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/change-proposals/{proposalId}/response:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: proposalId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    post:
      tags: [Bookings]
      operationId: respondBookingChangeProposal
      summary: Aceptar, rechazar o retirar una modificación propuesta
      description: |
        ACEPTAR y RECHAZAR corresponden a la contraparte; RETIRAR, a quien propuso. Al aceptar se registra un acuerdo rectificativo sin sobrescribir el original (SRS-BOOK-004, SRS-BOOK-005).
        En la organizadora la usan los roles que pueden cancelar contrataciones.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [decision], properties: {decision: {type: string, enum: [ACEPTAR, RECHAZAR, RETIRAR]}}, additionalProperties: false}
      responses:
        '200': {description: Propuesta actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/BookingChangeProposal'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /bookings/{bookingId}/provider-contact:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: bookingId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Bookings]
      operationId: getBookingProviderContact
      summary: Revelar el contacto del proveedor contratado
      description: |
        Solo miembros de la empresa de la contratación y mientras no esté CANCELADO ni NO_PRESTADO (en esos estados, 409 INVALID_STATE_TRANSITION).
        Cada consulta queda auditada; la respuesta no se almacena en caché (SRS-CAT-015; DEC-028).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Contacto del proveedor, content: {application/json: {schema: {$ref: '#/components/schemas/ProviderContact'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /whatsapp-templates:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
    get:
      tags: [Organizations]
      operationId: listAvailableWhatsappTemplates
      summary: Listar plantillas WhatsApp utilizables
      description: |
        Plantillas globales activas y copias privadas de la empresa activa (SRS-WA-001).
      parameters:
        - {name: categoryId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Plantillas utilizables, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AvailableWhatsappTemplate'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /quotations/{quotationId}/documents:
    parameters:
      - {$ref: '#/components/parameters/OrganizationId'}
      - {name: quotationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Quotations]
      operationId: listQuotationDocuments
      summary: Listar documentos y versiones de una cotización
      description: |
        Historial por versión (SRS-QUO-012, SRS-QUO-014). La URL de descarga se obtiene con getDocument.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Documentos paginados, content: {application/json: {schema: {$ref: '#/components/schemas/QuotationDocumentPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsersForAdmin
      summary: Listar usuarios
      description: |
        SRS-AUTH-007, SRS-ADM-005.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {type: string, enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION_EMAIL]}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Usuarios paginados, content: {application/json: {schema: {$ref: '#/components/schemas/AdminUserPage'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/organizations:
    get:
      tags: [Admin]
      operationId: listOrganizationsForAdmin
      summary: Listar empresas organizadoras
      description: |
        SRS-ADM-009.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 120}}
        - {name: status, in: query, schema: {type: string, enum: [PENDIENTE_VERIFICACION_EMAIL, ACTIVO, SUSPENDIDO]}}
        - {name: planCode, in: query, schema: {$ref: '#/components/schemas/PlanCode'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Empresas paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganizationPage'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/organizations/{organizationId}:
    parameters:
      - {name: organizationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Admin]
      operationId: getOrganizationForAdmin
      summary: Consultar empresa, plan y consumo
      description: |
        SRS-ADM-009.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Empresa, content: {application/json: {schema: {$ref: '#/components/schemas/AdminOrganizationDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/plans:
    get:
      tags: [Admin]
      operationId: listPlans
      summary: Listar planes y sus revisiones
      description: |
        SRS-ADM-009; DEC-029.
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Planes paginados, content: {application/json: {schema: {$ref: '#/components/schemas/PlanPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Admin]
      operationId: createPlanVersion
      summary: Crear una revisión de plan
      description: |
        Crea una nueva revisión de un código de plan; las revisiones anteriores no se editan (SRS-ADM-009, SRS-TEN-004). Vigencias solapadas responden 409.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanInput'}
      responses:
        '201': {description: Revisión creada, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/plans/{planId}:
    parameters:
      - {name: planId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updatePlan
      summary: Cerrar la vigencia o desactivar una revisión
      description: |
        Solo cambia active y validUntil; precio y límites exigen una revisión nueva.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlanUpdate'}
      responses:
        '200': {description: Plan actualizado, content: {application/json: {schema: {$ref: '#/components/schemas/Plan'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/providers/{providerId}:
    parameters:
      - {name: providerId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    get:
      tags: [Admin]
      operationId: getProviderForAdmin
      summary: Consultar proveedor, evidencia y decisiones
      description: |
        Incluye envíos a revisión, decisiones, paquetes y portafolio (SRS-ADM-001). El acceso queda auditado.
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Detalle del proveedor, content: {application/json: {schema: {$ref: '#/components/schemas/AdminProviderDetail'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/commissions:
    get:
      tags: [Admin]
      operationId: listCommissions
      summary: Listar comisiones
      description: |
        SRS-ADM-008, SRS-BOOK-010.
      parameters:
        - {name: period, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/CommissionStatus'}}
        - {name: organizationId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Comisiones paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/CommissionPage'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/commissions/{commissionId}:
    parameters:
      - {name: commissionId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    patch:
      tags: [Admin]
      operationId: updateCommissionReferences
      summary: Registrar referencias de factura y pago
      description: |
        Dato de conciliación manual; no genera cobro ni factura (SRS-ADM-008; DEC-033).
      parameters:
        - {$ref: '#/components/parameters/CorrelationId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommissionReferencesInput'}
      responses:
        '200': {description: Comisión actualizada, content: {application/json: {schema: {$ref: '#/components/schemas/CommissionRecord'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/subscriptions/export:
    get:
      tags: [Admin]
      operationId: exportSubscriptions
      summary: Exportar suscripciones activas por plan en CSV
      description: |
        SRS-ADM-008.
      parameters:
        - {name: period, in: query, required: true, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: format, in: query, schema: {type: string, enum: [CSV], default: CSV}}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Archivo CSV, content: {text/csv: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/legal-holds:
    get:
      tags: [Admin]
      operationId: listLegalHolds
      summary: Listar retenciones legales
      description: |
        SRS-ADM-012.
      parameters:
        - {name: resourceType, in: query, schema: {$ref: '#/components/schemas/LegalHoldResourceType'}}
        - {name: activeOnly, in: query, schema: {type: boolean, default: true}}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/CorrelationId'}
      responses:
        '200': {description: Retenciones paginadas, content: {application/json: {schema: {$ref: '#/components/schemas/LegalHoldPage'}}}}
        '400': {$ref: '#/components/responses/ValidationError'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Auth0 validado por backend (firma, issuer, audience y expiración).
  parameters:
    OrganizationId: {name: X-Organization-Id, in: header, required: false, schema: {$ref: '#/components/schemas/UUID'}, description: 'Organización activa (TEC-006); se valida contra las membresías del usuario. Obligatoria si el usuario tiene varias membresías.'}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
    CorrelationId: {name: X-Correlation-Id, in: header, required: false, schema: {type: string, maxLength: 128}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: Cursor opaco devuelto en CursorPageMeta.nextCursor (TEC-012)}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    PublicLimit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}, description: Máximo 50 en el catálogo público (SAD §11.1)}
  responses:
    Unauthorized: {description: No autenticado, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Sin permiso, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: No existe o no es accesible dentro del tenant, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicto de estado, capacidad, unicidad o idempotencia, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ValidationError: {description: Entrada inválida, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ValidationError'}}}}
    RateLimited: {description: Límite excedido, headers: {Retry-After: {schema: {type: integer}}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MagicLinkValidationError: {description: Entrada inválida, headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}, Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ValidationError'}}}}
    MagicLinkNotFound: {description: 'Token no válido, expirado, revocado o consumido, sin distinguir el motivo', headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}, Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MagicLinkConflict: {description: Conflicto de estado, SLA o idempotencia, headers: {Cache-Control: {$ref: '#/components/headers/NoStore'}, Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
    MagicLinkRateLimited: {description: Límite excedido, headers: {Retry-After: {schema: {type: integer}}, Cache-Control: {$ref: '#/components/headers/NoStore'}, Referrer-Policy: {$ref: '#/components/headers/NoReferrer'}}, content: {application/problem+json: {schema: {$ref: '#/components/schemas/Error'}}}}
  headers:
    NoStore: {description: Ninguna respuesta de Magic Link se almacena en caché (SAD §7.3), schema: {type: string, const: no-store}}
    NoReferrer: {schema: {type: string, const: no-referrer}}
  schemas:
    UUID: {type: string, format: uuid}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: string, pattern: '^[0-9]{1,12}(\.[0-9]{1,2})?$'}
        currency: {type: string, const: COP}
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, ORGANIZATION_REQUIRED, PLAN_LIMIT_REACHED, CAPACITY_EXHAUSTED, AWARD_ALREADY_EXISTS, OFFER_NOT_AWARDABLE, OFFER_EXPIRED, RFQ_NOT_OPEN, SLA_EXPIRED, MAGIC_LINK_INVALID, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REUSED, PRECONDITION_FAILED, ASSISTED_RESPONSE_MISMATCH, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]
    Error:
      type: object
      description: RFC 9457 (TEC-011)
      required: [type, title, status, code, correlationId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        correlationId: {type: string}
        details: {type: object, additionalProperties: true}
    ValidationError:
      allOf:
        - {$ref: '#/components/schemas/Error'}
        - type: object
          properties:
            fieldErrors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: {type: string}
                  message: {type: string}
    PageMeta:
      type: object
      description: Paginación por página (TEC-012). Todos los campos son obligatorios.
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        totalItems: {type: integer}
        totalPages: {type: integer}
    CursorPageMeta:
      type: object
      description: Paginación por cursor (TEC-012). nextCursor es null en la última página.
      required: [limit, nextCursor]
      properties:
        limit: {type: integer}
        nextCursor: {type: [string, 'null']}
    NotificationPreferences:
      type: object
      description: Preferencias por categoría (SRS-NOT-003). Las categorías obligatorias (seguridad, transacciones, cumplimiento) no pueden desactivarse; mandatory es de solo lectura.
      properties:
        categories:
          type: object
          propertyNames: {enum: [CUENTA_Y_SEGURIDAD, SOLICITUDES_RFQ, RESPUESTAS_Y_OFERTAS, RESERVAS_Y_CANCELACIONES, CIERRE_DE_SERVICIO, RECORDATORIOS_DE_EVENTO, CALIFICACIONES, NOVEDADES_DE_PLATAFORMA]}
          additionalProperties:
            type: object
            properties:
              email: {type: boolean}
              inApp: {type: boolean}
              mandatory: {type: boolean, readOnly: true}
    CurrentUser:
      type: object
      properties:
        phone: {type: [string, 'null'], maxLength: 40}
        id: {$ref: '#/components/schemas/UUID'}
        authSubject: {type: string}
        email: {type: string, format: email}
        displayName: {type: [string, 'null']}
        roles: {type: array, description: 'Roles globales (PROVEEDOR, ADMIN_PLATAFORMA). Los roles de empresa están en memberships[].role, que es la fuente autoritativa (DEC-022).', items: {type: string, enum: [PROVEEDOR, ADMIN_PLATAFORMA]}}
        memberships: {type: array, items: {type: object, properties: {membershipId: {$ref: '#/components/schemas/UUID'}, organizationId: {$ref: '#/components/schemas/UUID'}, organizationName: {type: string, description: Nombre comercial o razón social., maxLength: 200}, organizationStatus: {type: string, enum: [PENDIENTE_VERIFICACION_EMAIL, ACTIVO, SUSPENDIDO]}, role: {$ref: '#/components/schemas/MembershipRole'}}}}
        status: {type: string, enum: [ACTIVO, SUSPENDIDO, PENDIENTE_VERIFICACION_EMAIL]}
        notificationPreferences: {$ref: '#/components/schemas/NotificationPreferences'}
    OrganizationRegistration:
      type: object
      required: [legalName, taxId, contactName, phone, city, termsAccepted, privacyAccepted, privacyNoticeVersion]
      properties:
        legalName: {type: string, maxLength: 200}
        tradeName: {type: [string, 'null'], maxLength: 200}
        taxId: {type: string, minLength: 5, maxLength: 40}
        contactName: {type: string, maxLength: 160}
        phone: {type: string, maxLength: 40}
        city: {type: string, maxLength: 120}
        termsAccepted: {type: boolean, const: true}
        privacyAccepted: {type: boolean, const: true}
        privacyNoticeVersion: {type: string}
      additionalProperties: false
    OrganizationUpdate:
      type: object
      properties:
        legalName: {type: string, maxLength: 200}
        tradeName: {type: [string, 'null'], maxLength: 200}
        phone: {type: string, maxLength: 40}
        city: {type: string, maxLength: 120}
      additionalProperties: false
    Organization:
      type: object
      properties:
        tradeName: {type: [string, 'null'], maxLength: 200}
        contactName: {type: string, maxLength: 160}
        contactEmail: {type: string, format: email}
        phone: {type: string, maxLength: 40}
        id: {$ref: '#/components/schemas/UUID'}
        legalName: {type: string, maxLength: 200}
        taxId: {type: string, maxLength: 40}
        city: {type: string, maxLength: 120}
        status: {type: string, enum: [PENDIENTE_VERIFICACION_EMAIL, ACTIVO, SUSPENDIDO]}
        plan: {$ref: '#/components/schemas/PlanAssignment'}
    Invitation:
      type: object
      properties:
        role: {$ref: '#/components/schemas/MembershipRole'}
        membershipId: {$ref: '#/components/schemas/UUID'}
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        status: {type: string, enum: [PENDIENTE, ACEPTADA, EXPIRADA, REVOCADA]}
        expiresAt: {type: string, format: date-time}
    MembershipRole:
      description: |
        Roles de membresía con permisos predefinidos (DEC-008, DEC-011; vocabulario único DEC-022). Una empresa tiene un único
        PROPIETARIO y uno o más ADMIN_EMPRESA; COORDINADOR_RESTRINGIDO limita el acceso a eventos asignados sin facultad de
        adjudicar ni cancelar contrataciones (SRS-AUTH-009, SRS-AUTH-011).
      type: string
      enum: [PROPIETARIO, ADMIN_EMPRESA, COORDINADOR, COORDINADOR_RESTRINGIDO]
    Coordinator:
      type: object
      properties:
        invitationId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}], description: 'Invitación pendiente de un miembro INVITADO (SRS-AUTH-006).'}
        id: {$ref: '#/components/schemas/UUID'}
        email: {type: string, format: email}
        displayName: {type: [string, 'null']}
        status: {type: string, enum: [ACTIVO, INVITADO, SUSPENDIDO]}
        role: {$ref: '#/components/schemas/MembershipRole'}
    CoordinatorPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Coordinator'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    OwnershipTransfer:
      type: object
      properties:
        fromMembershipId: {$ref: '#/components/schemas/UUID'}
        fromDisplayName: {type: [string, 'null']}
        newOwnerDisplayName: {type: [string, 'null']}
        id: {$ref: '#/components/schemas/UUID'}
        newOwnerMembershipId: {$ref: '#/components/schemas/UUID'}
        status: {type: string, enum: [PENDIENTE, ACEPTADA, RECHAZADA, EXPIRADA]}
        expiresAt: {type: string, format: date-time}
    PlanCode:
      type: string
      enum: [PRUEBA, BASICO, PRO, ENTERPRISE]
    PlanLimit:
      type: object
      required: [used]
      properties:
        limit: {type: [integer, 'null'], minimum: 0, description: Cuota configurada; null si el plan no define cuota (SRS-TEN-003)}
        used: {type: integer, minimum: 0}
    PlanUsage:
      type: object
      properties:
        planCode: {$ref: '#/components/schemas/PlanCode'}
        validFrom: {type: string, format: date-time}
        validUntil: {type: [string, 'null'], format: date-time}
        limits:
          type: object
          description: Límites del plan (SRS-TEN-003) con consumo actual.
          properties:
            activeEvents: {$ref: '#/components/schemas/PlanLimit'}
            monthlyQuotations: {$ref: '#/components/schemas/PlanLimit'}
            coordinators: {$ref: '#/components/schemas/PlanLimit'}
            customTemplates: {$ref: '#/components/schemas/PlanLimit'}
    SuspensionInput:
      type: object
      required: [suspended, reason]
      properties:
        suspended: {type: boolean}
        reason: {type: [string, 'null'], maxLength: 1000, description: Obligatorio al suspender; queda auditado}
      additionalProperties: false
    EventAssignees:
      type: object
      properties:
        eventId: {$ref: '#/components/schemas/UUID'}
        membershipIds: {type: array, items: {$ref: '#/components/schemas/UUID'}}
    ProviderRegistration:
      type: object
      description: El email se toma del token Auth0 (TEC-007); no se envía en el cuerpo.
      required: [businessName, providerType, phone, city, primaryCategoryId, termsAccepted, privacyAccepted, privacyNoticeVersion]
      properties:
        businessName: {type: string, maxLength: 200}
        providerType: {type: string, enum: [PERSONA_NATURAL, EMPRESA]}
        taxId: {type: [string, 'null'], maxLength: 40, description: Opcional en el registro; obligatorio para el nivel 2 de verificación (DEC-009)}
        phone: {type: string, maxLength: 40}
        city: {type: string, maxLength: 120}
        whatsapp: {type: [string, 'null']}
        primaryCategoryId: {$ref: '#/components/schemas/UUID'}
        termsAccepted: {type: boolean, const: true}
        privacyAccepted: {type: boolean, const: true}
        privacyNoticeVersion: {type: string}
      additionalProperties: false
    ProviderUpdate:
      type: object
      properties:
        businessName: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        city: {type: string, maxLength: 120}
        coverageAreas: {type: array, items: {type: string}}
        phone: {type: string, maxLength: 40}
        whatsapp: {type: [string, 'null'], maxLength: 40}
        preferredChannel: {type: string, enum: [EMAIL_FORM, WHATSAPP, AMBOS]}
        maxCapacity: {type: [integer, 'null'], minimum: 1}
        categoryIds: {type: array, maxItems: 5, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
        subtypeIds: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/UUID'}}
      additionalProperties: false
    Provider:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        businessName: {type: string, maxLength: 200}
        description: {type: [string, 'null']}
        city: {type: string, maxLength: 120}
        accountStatus: {type: string, enum: [ACTIVO, SUSPENDIDO], description: Estado de cuenta, independiente de la verificación (DEC-031)}
        verificationStatus: {type: string, enum: [PENDIENTE, VERIFICADO, RECHAZADO]}
        verificationLevel: {type: [integer, 'null'], minimum: 1, maximum: 3}
        preferredChannel: {type: string, enum: [EMAIL_FORM, WHATSAPP, AMBOS]}
        categoryIds: {type: array, items: {$ref: '#/components/schemas/UUID'}}
        subtypeIds: {type: array, items: {$ref: '#/components/schemas/UUID'}}
    PublicProvider:
      type: object
      description: Vista pública; nunca incluye teléfono, WhatsApp ni email (DEC-028) ni estados internos.
      properties:
        portfolio: {type: array, description: 'Portafolio público en orden (SRS-CAT-002). Solo lo devuelve getPublicProvider.', items: {$ref: '#/components/schemas/PublicMedia'}}
        id: {$ref: '#/components/schemas/UUID'}
        businessName: {type: string, maxLength: 200}
        description: {type: [string, 'null']}
        city: {type: string, maxLength: 120}
        primaryPhotoUrl: {type: [string, 'null'], format: uri}
        priceFrom: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        modalities: {type: array, items: {$ref: '#/components/schemas/BookingModality'}}
        categories:
          type: array
          items:
            type: object
            properties:
              id: {$ref: '#/components/schemas/UUID'}
              code: {type: string}
              name: {type: string}
              subtypes: {type: array, items: {type: object, properties: {id: {$ref: '#/components/schemas/UUID'}, code: {type: string}, name: {type: string}}}}
        verificationBadge: {type: string, enum: [IDENTIDAD_CONTACTO_VERIFICADOS, EXPERIENCIA_REVISADA], description: Etiqueta pública de verificación (SRS-ADM-001)}
        ratingAverage: {type: [number, 'null'], minimum: 0, maximum: 5}
        reviewCount: {type: integer}
        rankingExplanation: {type: [string, 'null'], description: 'Explicación simple del orden, p. ej. "mejor valor" (SRS-QUO-004)'}
        packages: {type: array, items: {$ref: '#/components/schemas/ServicePackage'}}
    PackageFields:
      type: object
      required: [name, categoryId, subtypeId, basePrice, modality, taxTreatment]
      properties:
        name: {type: string, maxLength: 160}
        categoryId: {$ref: '#/components/schemas/UUID'}
        subtypeId: {$ref: '#/components/schemas/UUID'}
        description: {type: [string, 'null'], maxLength: 4000}
        basePrice: {$ref: '#/components/schemas/Money'}
        pricePerPerson: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        inclusions: {type: array, items: {type: string}}
        exclusions: {type: array, items: {type: string}}
        modality: {$ref: '#/components/schemas/BookingModality'}
        taxTreatment: {$ref: '#/components/schemas/TaxTreatment'}
        packageCapacity: {type: [integer, 'null'], minimum: 1, description: Capacidad propia del paquete por fecha (DEC-006); null hereda la global}
        independentInventory: {type: boolean, default: false, description: Si true, la reserva no consume la capacidad global del proveedor}
        active: {type: boolean, default: true}
    PackageInput:
      allOf:
        - {$ref: '#/components/schemas/PackageFields'}
      unevaluatedProperties: false
    TaxTreatment:
      type: object
      description: Tratamiento de impuestos declarado por el proveedor, con vigencia (DEC-010); no se infiere.
      required: [mode, validFrom]
      properties:
        mode: {type: string, enum: [INCLUIDO, NO_APLICA, POR_CONFIRMAR]}
        taxRate: {description: 'Porcentaje ("19.00" es 19 %).', type: [string, 'null'], pattern: '^[0-9]{1,2}(\.[0-9]{1,2})?$', description: Tasa porcentual informativa, si aplica}
        validFrom: {type: string, format: date}
        validUntil: {type: [string, 'null'], format: date}
    PricingSummary:
      type: object
      description: Desglose con líneas redondeadas half-up al peso (DEC-032) y comisión a cargo del organizador sobre la base antes de impuestos (DEC-027).
      properties:
        priceDisplayLabel: {type: string, enum: [IMPUESTOS_INCLUIDOS, IMPUESTOS_NO_APLICAN, IMPUESTOS_POR_CONFIRMAR, MIXTO]}
        taxSummary: {type: array, items: {type: object, properties: {mode: {type: string, enum: [INCLUIDO, NO_APLICA, POR_CONFIRMAR]}, amount: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}}}}
        commissionRate: {type: [string, 'null'], description: Porcentaje versionado, p. ej. "3.00"}
        commissionBase: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
    ServicePackage:
      allOf:
        - {$ref: '#/components/schemas/PackageFields'}
        - type: object
          properties:
            id: {$ref: '#/components/schemas/UUID'}
            providerId: {$ref: '#/components/schemas/UUID'}
    PackagePage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/ServicePackage'}}
        page: {$ref: '#/components/schemas/PageMeta'}
    BookingModality: {type: string, enum: [INSTANT_BOOK, E_RFQ]}
    AvailabilityInput:
      type: object
      required: [date, blocked]
      properties:
        date: {type: string, format: date}
        blocked: {type: boolean}
        capacity: {type: [integer, 'null'], minimum: 1, description: 'Capacidad global del proveedor para la fecha (2 por defecto); un bloqueo equivale a capacidad cero (DEC-006).'}
        packageId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}], description: 'Si se indica, la capacidad aplica al paquete como excepción explícita; la reserva consume el cupo del paquete y el global salvo inventario independiente.'}
    AvailabilityDay:
      type: object
      properties:
        date: {type: string, format: date}
        blocked: {type: boolean}
        globalCapacity: {type: integer, minimum: 0, description: Capacidad global del proveedor para la fecha (2 por defecto, DEC-006)}
        consumed: {type: integer, minimum: 0, description: Unidades consumidas por contrataciones activas}
        packages:
          type: array
          items:
            type: object
            properties:
              packageId: {$ref: '#/components/schemas/UUID'}
              capacity: {type: integer, minimum: 0}
              consumed: {type: integer, minimum: 0}
              independentInventory: {type: boolean}
    Category:
      type: object
      properties:
        id: {$ref: '#/components/schemas/UUID'}
        code: {type: string, maxLength: 30}
        name: {type: string, maxLength: 120}
        active: {type: boolean}
        subtypes: {type: array, items: {$ref: '#/components/schemas/Subtype'}}
    Subtype:
      type: object
      properties:
        code: {type: string, readOnly: true, description: 'Código estable generado por el backend (DEC-020).'}
        id: {$ref: '#/components/schemas/UUID'}
        categoryId: {$ref: '#/components/schemas/UUID'}
        name: {type: string, maxLength: 120}
        active: {type: boolean}
    ProviderSearchPage:
      type: object
      required: [items, page]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PublicProvider'}}
        page: {$ref: '#/components/schemas/CursorPageMeta'}
    EventLocation:
      type: object
      required: [city]
      properties:
        address: {type: [string, 'null'], maxLength: 300}
        city: {type: string, maxLength: 120}
        latitude: {type: [number, 'null'], minimum: -90, maximum: 90}
        longitude: {type: [number, 'null'], minimum: -180, maximum: 180}
      additionalProperties: false
    EventFields:
      type: object
      required: [name, localStartsAt, localEndsAt, timeZone, guests, location]
      properties:
        name: {type: string, maxLength: 160}
        templateId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        localStartsAt: {$ref: '#/components/schemas/LocalDateTime'}
        localEndsAt: {$ref: '#/components/schemas/LocalDateTime'}
        timeZone: {maxLength: 64, type: string, description: 'Zona horaria IANA del evento, p. ej. America/Bogota; no se admiten offsets fijos.', examples: [America/Bogota]}
        guests: {type: integer, minimum: 1}
        location: {$ref: '#/components/schemas/EventLocation'}
        estimatedBudget: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        coordinatorId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        notes: {type: [string, 'null'], maxLength: 5000}
    EventInput:
      allOf:
        - {$ref: '#/components/schemas/EventFields'}
      unevaluatedProperties: false
    EventUpdate:
      type: object
      description: Con contrataciones activas no se pueden cambiar localStartsAt, localEndsAt ni timeZone (409 INVALID_STATE_TRANSITION); con RFQ abiertas, cambiar fechas, ubicación o invitados revoca las solicitudes (SRS-EVT-008, DEC-024).
      properties:
        name: {type: string, maxLength: 160}
        localStartsAt: {$ref: '#/components/schemas/LocalDateTime'}
        localEndsAt: {$ref: '#/components/schemas/LocalDateTime'}
        timeZone: {maxLength: 64, type: string}
        guests: {type: integer, minimum: 1}
        location: {$ref: '#/components/schemas/EventLocation'}
        estimatedBudget: {oneOf: [{$ref: '#/components/schemas/Money'}, {type: 'null'}]}
        coordinatorId: {oneOf: [{$ref: '#/components/schemas/UUID'}, {type: 'null'}]}
        notes: {type: [string, 'null'], maxLength: 5000}
      additionalProperties: false
